_BASE_: "../Base-RCNN-FPN.yaml"
MODEL:
  # WEIGHTS: "detectron2://ImageNetPretrained/MSRA/R-50.pkl"
  # For better, more stable performance initialize from COCO
  #WEIGHTS: "detectron2://COCO-InstanceSegmentation/mask_rcnn_R_50_FPN_3x/137849600/model_final_f10217.pkl"
  META_ARCHITECTURE: "SoM_MIMO_RCNN"
  BACKBONE:
    NAME: "build_som_mimo_backbone_CITY"
  MASK_ON: True
  ROI_HEADS:
    NUM_CLASSES: 8
# This is similar to the setting used in Mask R-CNN paper, Appendix A
# But there are some differences, e.g., we did not initialize the output
# layer using the corresponding classes from COCO
INPUT:
  MIN_SIZE_TRAIN: (800, 832, 864, 896, 928, 960, 992, 1024)
  MIN_SIZE_TRAIN_SAMPLING: "choice"
  MIN_SIZE_TEST: 1024
  MAX_SIZE_TRAIN: 2048
  MAX_SIZE_TEST: 2048
DATASETS:
  TRAIN: ("cityscapes_fine_instance_seg_train",)
  TEST: ("cityscapes_fine_instance_seg_val",)

SOLVER:
  IMS_PER_BATCH: 4
  WEIGHT_DECAY: 0.05
  WEIGHT_DECAY_BIAS: 1e-5
  CHECKPOINT_PERIOD: 37001
  AMP: 
    ENABLED: False
TEST:
  #EVAL_PERIOD: 1480
  EVAL_PERIOD: -1